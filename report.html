<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071a3a">
<title>F/B LAM Report</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#eef2f7;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Segoe UI",sans-serif;color:#0f172a}
body{display:grid;grid-template-rows:auto 1fr;min-height:100vh}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;background:#071a3a;color:#fff;border-bottom:1px solid rgba(255,255,255,.08)}
.left{display:flex;align-items:center;gap:10px;min-width:0}.back{display:inline-flex;align-items:center;justify-content:center;min-height:36px;padding:0 12px;border-radius:999px;background:#fff;color:#0b2d63;text-decoration:none;font-size:12px;font-weight:900}.meta{min-width:0}.title{font-size:13px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{margin-top:2px;color:#cbd5e1;font-size:10px}.status{font-size:10px;color:#f2cf73;white-space:nowrap}
.stage{position:relative;min-height:0}.frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}.msg{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:#64748b;font-size:13px}.msg b{display:block;color:#173e73;font-size:16px;margin-bottom:8px}
@media(max-width:620px){.top{padding:8px 10px}.back{min-height:34px;padding:0 10px}.status{display:none}}
</style>
</head>
<body>
<div class="top">
  <div class="left">
    <a class="back" href="./">← 목록</a>
    <div class="meta">
      <div class="title" id="title">F/B LAM Report</div>
      <div class="sub" id="sub">Google Sheet DB 조회 중</div>
    </div>
  </div>
  <div class="status" id="status">LOADING</div>
</div>
<div class="stage">
  <div class="msg" id="msg"><div><b>리포트를 불러오는 중</b>Google Sheet DB 연결 중</div></div>
  <iframe id="frame" class="frame" style="display:none" sandbox="allow-scripts allow-same-origin allow-downloads allow-popups allow-modals allow-forms"></iframe>
</div>
<script>
(function(){
  var GAS_URL='https://script.google.com/macros/s/AKfycbyAiW_pTfzhaWI7fD3KvRFNYYHiXv6M6IUA5rjbtyQwaYuhBqN9UQY5Nwd8VE666ZYV/exec';
  function el(id){return document.getElementById(id);}
  function q(name){return new URLSearchParams(location.search).get(name)||'';}
  var id=q('id'),date=q('date');
  var query=id?'id='+encodeURIComponent(id):'date='+encodeURIComponent(date);

  fetch(GAS_URL+'?action=getReportHtml&'+query+'&_='+Date.now(),{cache:'no-store',redirect:'follow'})
    .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
    .then(function(p){
      if(!p.ok||!p.found||!p.htmlText)throw new Error(p.error||'저장된 리포트를 찾을 수 없습니다.');
      var kind=p.reportType==='weekly'?'WEEKLY':p.reportType==='special'?'SPECIAL':'DAILY';
      el('title').textContent=p.title||'F/B LAM Report';
      el('sub').textContent=(p.date||'')+' · '+kind+(p.weekStart?' · '+p.weekStart+' ~ '+p.date:'');
      el('status').textContent='DB SYNC';
      el('frame').srcdoc=p.htmlText;
      el('frame').style.display='block';
      el('msg').style.display='none';
      document.title=(p.title||'F/B LAM Report')+' · '+(p.date||'');
    })
    .catch(function(err){
      el('status').textContent='ERROR';
      el('msg').innerHTML='<div><b>리포트를 불러오지 못했습니다.</b>'+String(err.message||err)+'</div>';
    });
})();
</script>
</body>
</html>
