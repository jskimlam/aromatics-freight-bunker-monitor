name: Publish latest freight dashboard

on:
  push:
    branches:
      - main
    paths:
      - 'freight_*.html'
      - 'freight_bunker_dashboard_*.html'

permissions:
  contents: write

jobs:
  publish-latest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build premium landing and latest report
        shell: python
        run: |
          from pathlib import Path
          from html import escape
          import json, re, shutil

          ADMIN_URL = "https://script.google.com/macros/s/AKfycbzc08bNohxOAV_iE8x8YZ7v1sOn7tyIID3xK2eoXR6vlrZOIxHBn66-sZGoKDiyF5lH/exec?page=admin"
          reports = []

          for p in Path('.').glob('*.html'):
              m = re.fullmatch(r'freight_(\d{8})\.html', p.name, re.I)
              if m:
                  reports.append((m.group(1), p, 0))
                  continue
              m = re.fullmatch(r'freight_bunker_dashboard_(\d{4})-(\d{2})-(\d{2})(?:_[A-Za-z0-9_-]+)?\.html', p.name, re.I)
              if m:
                  reports.append((''.join(m.groups()), p, 1))

          if not reports:
              raise SystemExit('No dated freight dashboard HTML found.')

          best = {}
          for ymd, p, score in reports:
              if ymd not in best or score < best[ymd][0]:
                  best[ymd] = (score, p)

          reports = sorted([(ymd, v[1]) for ymd, v in best.items()], reverse=True)
          latest_ymd, latest_src = reports[0]
          shutil.copyfile(latest_src, 'latest.html')

          latest_text = latest_src.read_text(encoding='utf-8', errors='ignore')

          history_start = '–'
          tracked = '–'
          brief_title = '북아시아 HSFO 종목 브리핑'
          brief_summary = '최신 운임·벙커 리포트와 누적 시계열을 한 화면에서 확인.'

          m = re.search(r'<script id="rawData" type="application/json">(.*?)</script>', latest_text, re.S)
          if m:
              try:
                  raw = json.loads(m.group(1).replace('<\\/','</'))
                  if raw.get('d'):
                      history_start = raw['d'][0]
                  if raw.get('c') is not None:
                      tracked = str(len(raw['c']))
              except Exception:
                  pass

          m = re.search(r'<script id="cmtData" type="application/json">(.*?)</script>', latest_text, re.S)
          if m:
              try:
                  cmt = json.loads(m.group(1).replace('<\\/','</'))
                  if cmt:
                      cmt = sorted(cmt, key=lambda x: x.get('date',''), reverse=True)
                      c = cmt[0]
                      brief_title = c.get('title') or brief_title
                      s = c.get('sum') or []
                      if s:
                          brief_summary = ' '.join(str(x) for x in s[:2])
              except Exception:
                  pass

          def dt(ymd):
              return f'{ymd[:4]}-{ymd[4:6]}-{ymd[6:8]}'

          cards = []
          for ymd, p in reports:
              cards.append(f'''<a class="report" href="{escape(p.name)}"><div class="report-date">{dt(ymd)}</div><div><div class="report-title">운임 · 벙커 데일리 리포트</div><div class="report-file">{escape(p.name)}</div></div><div class="arrow">→</div></a>''')

          latest_file = escape(latest_src.name)
          latest_date = dt(latest_ymd)
          index = f'''<!doctype html>
          <html lang="ko">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
          <meta name="theme-color" content="#071a3a">
          <title>Aromatics Freight Monitor</title>
          <style>
          :root{{--navy:#071a3a;--navy2:#0b2d63;--navy3:#174a96;--gold:#d9ad39;--gold2:#f0cf76;--paper:#fff;--bg:#f3f6fb;--line:#dbe4ef;--ink:#0f172a;--ink2:#566a82;--blue:#2b6ec8;--shadow:0 18px 44px rgba(7,26,58,.09)}}
          *{{box-sizing:border-box}}html,body{{margin:0;background:linear-gradient(180deg,#f8fafc 0%,#f1f5f9 100%);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Segoe UI",sans-serif}}body{{min-height:100vh}}a{{text-decoration:none;color:inherit}}.wrap{{max-width:1240px;margin:0 auto;padding:0 20px}}
          .hero{{position:relative;overflow:hidden;color:#fff;background:radial-gradient(circle at 14% 10%,rgba(240,207,118,.20),transparent 25%),radial-gradient(circle at 85% 10%,rgba(89,147,236,.22),transparent 26%),linear-gradient(135deg,#061633 0%,#0b2d63 52%,#174a96 100%);border-bottom:1px solid rgba(255,255,255,.08)}}.hero:after{{content:"";position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:32px 32px;mask-image:linear-gradient(to bottom,rgba(0,0,0,.45),transparent 88%)}}
          .top{{position:relative;z-index:1;display:flex;justify-content:space-between;gap:24px;align-items:flex-end;padding-top:34px}}.brand-kicker{{display:flex;align-items:center;gap:10px;font-size:11px;font-weight:850;letter-spacing:.20em;color:#c7d8ef}}.mark{{display:inline-flex;align-items:center;justify-content:center;height:29px;min-width:56px;padding:0 13px;border-radius:999px;color:#f3cd67;background:rgba(255,255,255,.07);border:1px solid rgba(255,226,148,.32);letter-spacing:.14em}}h1{{margin:8px 0 0;font-size:clamp(32px,4.2vw,58px);line-height:.98;letter-spacing:-.05em;font-weight:900}}.subtitle{{margin-top:12px;color:#d8e3f1;font-size:14px;font-weight:600;letter-spacing:.02em}}.creator{{display:inline-flex;align-items:center;gap:7px;margin-top:9px;padding:7px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.055);font-size:13px;font-weight:800;letter-spacing:.03em;color:#e3ebf6}}.creator b{{color:#f1cb67;letter-spacing:.08em;font-size:14px}}
          .actions{{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}}.btn{{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 17px;border-radius:999px;font-size:12px;font-weight:850;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.07);color:#fff}}.btn.primary{{background:linear-gradient(135deg,#f0cf76,#d9ad39);color:#082651;border-color:rgba(255,255,255,.42);box-shadow:0 10px 24px rgba(0,0,0,.18)}}
          .hero-grid{{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1.75fr) repeat(3,minmax(0,.7fr));gap:14px;padding:26px 0 30px}}.hero-card{{border:1px solid rgba(255,255,255,.13);border-radius:20px;padding:18px 18px 16px;background:linear-gradient(180deg,rgba(255,255,255,.13),rgba(255,255,255,.055));box-shadow:0 16px 36px rgba(0,0,0,.12)}}.hero-main{{padding:22px}}.k{{font-size:10px;font-weight:900;letter-spacing:.15em;color:#cbd9eb}}.hero-main .title{{margin-top:8px;font-size:clamp(19px,2vw,27px);font-weight:900;letter-spacing:-.03em;color:#fff2cd;line-height:1.25}}.hero-main .summary{{margin-top:11px;max-width:760px;color:#e5edf7;font-size:13px;line-height:1.75}}.hero-card .value{{margin-top:10px;font-size:clamp(23px,2.2vw,31px);font-weight:900;letter-spacing:-.035em}}.hero-card .small{{margin-top:6px;color:#cbd8e8;font-size:11px;line-height:1.55}}
          main{{padding:26px 0 52px}}.dashboard-grid{{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(360px,.85fr);gap:18px;align-items:start}}
          .wti-panel{{position:sticky;top:16px;overflow:hidden}}
          .wti-head{{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:15px}}.wti-kicker{{font-size:9px;font-weight:900;letter-spacing:.16em;color:#6f86a0}}.wti-head h2{{margin:3px 0 0;font-size:21px;letter-spacing:-.025em;color:#102c51}}.wti-head p{{margin:4px 0 0;font-size:11px;color:#7a8da2}}.wti-badge{{display:inline-flex;align-items:center;justify-content:center;min-width:40px;height:24px;border-radius:999px;background:#eef4fa;border:1px solid #d7e3ef;color:#173e73;font-size:10px;font-weight:900;letter-spacing:.08em}}
          .wti-quote{{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:14px 15px;border:1px solid #dbe5ef;border-radius:16px;background:linear-gradient(135deg,#f7faff 0%,#eef4fb 100%);margin-bottom:10px}}.wti-quote .lab{{font-size:9.5px;font-weight:900;letter-spacing:.12em;color:#75889d}}.wti-quote .price{{margin-top:3px;font-size:32px;line-height:1;font-weight:900;letter-spacing:-.045em;color:#0d2d55;font-variant-numeric:tabular-nums}}.wti-quote .price small{{font-size:12px;font-weight:700;color:#74869a;margin-left:3px}}.wti-quote .date{{margin-top:5px;font-size:10.5px;color:#8191a4}}.wti-changebox{{text-align:right}}.wti-changebox .chg{{display:inline-flex;align-items:center;justify-content:center;padding:6px 9px;border-radius:999px;font-size:12px;font-weight:900;font-variant-numeric:tabular-nums}}.wti-changebox .chg.up{{background:#fff0ef;color:#bd3838}}.wti-changebox .chg.down{{background:#edf4ff;color:#275fa7}}.wti-changebox .chg.flat{{background:#f1f5f9;color:#64748b}}.wti-changebox .prev{{display:block;margin-top:5px;font-size:9.5px;color:#8a98aa}}
          .wti-stats{{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:11px}}.wti-stat{{padding:9px 10px;border:1px solid #e1e8f0;border-radius:12px;background:#fff}}.wti-stat span{{display:block;font-size:8.8px;font-weight:900;letter-spacing:.08em;color:#8594a6}}.wti-stat strong{{display:block;margin-top:3px;font-size:15px;color:#173b67;font-weight:900;font-variant-numeric:tabular-nums}}.wti-stat em{{display:block;margin-top:2px;font-style:normal;font-size:9px;color:#9aa6b5}}
          .wti-chart-shell{{border:1px solid #dce6f0;border-radius:16px;background:linear-gradient(180deg,#ffffff 0%,#f9fbfe 100%);padding:8px 8px 4px;box-shadow:inset 0 1px 0 rgba(255,255,255,.8)}}.wti-chart{{min-height:300px;display:flex;align-items:center}}.wti-chart svg{{display:block;width:100%;height:auto}}.wti-chart .grid{{stroke:#e8eef5;stroke-width:1}}.wti-chart .axis-text{{font-size:9.5px;fill:#8493a5;font-family:inherit}}.wti-chart .range-line{{stroke:#9db0c5;stroke-width:1;stroke-dasharray:4 5}}.wti-chart .range-text{{font-size:8.5px;fill:#6f8196;font-weight:800;font-family:inherit;letter-spacing:.04em}}.wti-chart .area{{fill:url(#wtiArea)}}.wti-chart .trend{{fill:none;stroke:#173e73;stroke-width:3.2;stroke-linejoin:round;stroke-linecap:round}}.wti-chart .point{{fill:#fff;stroke:#315d8f;stroke-width:1.7}}.wti-chart .point.latest{{fill:#173e73;stroke:#fff;stroke-width:3}}.wti-chart .point.extreme{{fill:#fff;stroke:#6b85a3;stroke-width:2}}.wti-chart .latest-box{{fill:#173e73}}.wti-chart .latest-text{{fill:#fff;font-size:10px;font-weight:900;font-family:inherit}}.wti-chart .latest-guide{{stroke:#173e73;stroke-width:1;stroke-dasharray:3 4;opacity:.55}}.wti-empty{{width:100%;text-align:center;color:#8190a3;font-size:12px}}
          .wti-foot{{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:9px;padding-top:9px;border-top:1px solid #edf1f5;font-size:9.7px;color:#8492a3}}.wti-foot b{{color:#5e7187;font-weight:850}}.wti-foot .count{{font-variant-numeric:tabular-nums}}
          @media(max-width:960px){{.dashboard-grid{{grid-template-columns:1fr}}.wti-panel{{position:static}}.wti-chart{{min-height:280px}}}}@media(max-width:620px){{.wti-quote .price{{font-size:28px}}.wti-stats{{grid-template-columns:repeat(3,minmax(0,1fr))}}.wti-stat{{padding:8px}}.wti-stat strong{{font-size:13px}}.wti-chart{{min-height:250px}}}}.panel{{background:#fff;border:1px solid #dbe4ef;border-radius:20px;box-shadow:0 18px 44px rgba(7,26,58,.09);padding:20px;min-width:0}}.panel-head{{display:flex;justify-content:space-between;gap:16px;align-items:end;margin-bottom:16px}}.panel-head h2{{margin:0;font-size:22px;letter-spacing:-.03em;color:#102c51}}.panel-head p{{margin:5px 0 0;color:#566a82;font-size:12.5px}}.pill{{display:inline-flex;align-items:center;gap:6px;padding:7px 10px;border-radius:999px;background:#f8efd3;color:#7e5d0e;border:1px solid #eed991;font-size:10px;font-weight:900;letter-spacing:.05em}}
          .latest{{position:relative;overflow:hidden;border:1px solid #d9e3ef;border-radius:18px;padding:19px;background:linear-gradient(135deg,#fff 0%,#f8fbff 100%)}}.latest:after{{content:"";position:absolute;right:-40px;top:-40px;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,#eaf2ff 0%,transparent 70%)}}.latest .date{{font-size:12px;color:#66809e;font-weight:800}}.latest h3{{position:relative;z-index:1;margin:6px 0 0;font-size:21px;letter-spacing:-.025em;color:#102b50}}.latest .desc{{position:relative;z-index:1;margin-top:10px;color:#415a74;font-size:13px;line-height:1.7}}.latest .open{{position:relative;z-index:1;display:inline-flex;margin-top:15px;color:#1f5fbf;font-size:12px;font-weight:900}}
          .archive{{display:grid;gap:10px;margin-top:14px}}.report{{display:grid;grid-template-columns:96px 1fr auto;gap:14px;align-items:center;padding:13px 14px;border-radius:15px;border:1px solid #dbe4ef;background:#fff;transition:.16s}}.report:hover{{transform:translateY(-1px);border-color:#aabed6;box-shadow:0 8px 20px rgba(7,26,58,.05)}}.report-date{{font-size:13px;color:#173e73;font-weight:900;font-variant-numeric:tabular-nums}}.report-title{{font-size:13px;font-weight:850;color:#1b3555}}.report-file{{margin-top:3px;color:#8190a3;font:10px ui-monospace,SFMono-Regular,Menlo,monospace}}.arrow{{width:31px;height:31px;border-radius:50%;display:grid;place-items:center;background:#f0f5fb;color:#1f5fbf;font-weight:900}}
          .side-grid{{display:grid;gap:12px}}.info{{padding:16px;border-radius:16px;border:1px solid #dbe4ef;background:linear-gradient(180deg,#fff,#fbfcfe)}}.info .name{{font-size:11px;color:#6a7c92;font-weight:850;letter-spacing:.04em}}.info .big{{margin-top:7px;font-size:24px;font-weight:900;color:#102b4f;letter-spacing:-.03em}}.info .note{{margin-top:5px;font-size:11px;line-height:1.55;color:#7a899a}}.workflow{{margin-top:12px;padding:15px 16px;border-radius:16px;background:#0b2d63;color:#fff}}.workflow b{{display:block;font-size:12px;letter-spacing:.06em}}.workflow p{{margin:8px 0 0;color:#d7e2f0;font-size:11px;line-height:1.65}}footer{{padding:18px 0 30px;color:#8794a5;font-size:10.5px}}
          @media(max-width:960px){{.hero-grid{{grid-template-columns:1fr 1fr}}.hero-main{{grid-column:1/-1}}.dashboard-grid{{grid-template-columns:1fr}}}}@media(max-width:620px){{.wrap{{padding:0 12px}}.top{{display:block;padding-top:22px}}.actions{{margin-top:16px;justify-content:flex-start}}.hero-grid{{grid-template-columns:1fr;gap:10px;padding-top:18px}}.hero-card,.hero-main{{padding:14px;border-radius:15px}}.panel{{padding:14px;border-radius:16px}}.report{{grid-template-columns:84px 1fr auto;gap:10px;padding:12px}}.report-file{{display:none}}.btn{{min-height:40px;padding:0 14px}}.brand-kicker{{font-size:9px}}h1{{font-size:34px}}.subtitle{{font-size:12px}}}}
          </style>
          </head>
          <body>
          <header class="hero"><div class="wrap">
            <div class="top"><div><div class="brand-kicker"><span class="mark">AFM</span>AROMATICS FREIGHT MONITOR</div><h1>Freight &amp; Bunker<br>Market Intelligence</h1><div class="subtitle">Chemical Freight · Bunker · Market Intelligence</div><div class="creator"><b>LAM</b><span>created by JS Kim</span></div></div>
            <div class="actions"><a class="btn primary" href="latest.html">최신 리포트 열기</a><a class="btn" href="{ADMIN_URL}">관리자 모드</a></div></div>
            <div class="hero-grid">
              <section class="hero-card hero-main"><div class="k">LATEST MARKET BRIEF</div><div class="title">{escape(brief_title)}</div><div class="summary">{escape(brief_summary)}</div></section>
              <section class="hero-card"><div class="k">LATEST DATE</div><div class="value">{latest_date}</div><div class="small">최신 평가 기준일</div></section>
              <section class="hero-card"><div class="k">TRACKED SERIES</div><div class="value">{tracked}</div><div class="small">운임 · 벙커 · 원료</div></section>
              <section class="hero-card"><div class="k">ARCHIVE</div><div class="value">{len(reports)}</div><div class="small">누적 HTML 리포트</div></section>
            </div>
          </div></header>
          <main><div class="wrap dashboard-grid">
            <section class="panel">
              <div class="panel-head"><div><h2>Daily Research Archive</h2><p>최신 리포트와 날짜별 HTML 아카이브</p></div><span class="pill">LATEST · {latest_date}</span></div>
              <article class="latest"><div class="date">{latest_date} · DAILY REPORT</div><h3>아로마 케미칼 운임 · 벙커 대시보드</h3><div class="desc">핵심 지표, 기간별 등락, 벙커 코멘터리, 추세 분석, 개별 지표, 운임 변동 내역을 통합한 최신 리서치 화면.</div><a class="open" href="{latest_file}">최신 리포트 바로 열기 →</a></article>
              <div class="archive">{''.join(cards)}</div>
            </section>
            <aside class="panel wti-panel" id="wtiPanel">
              <div class="wti-head">
                <div><div class="wti-kicker">CRUDE OIL · DAILY SETTLEMENT</div><h2>WTI 2W Market Monitor</h2><p>최근 14일 실제 평가일 기준</p></div>
                <span class="wti-badge">2W</span>
              </div>
              <div class="wti-quote">
                <div><div class="lab">LATEST SETTLEMENT</div><div class="price" id="wtiLatest">–</div><div class="date" id="wtiDate">–</div></div>
                <div class="wti-changebox"><span class="chg flat" id="wtiChange">–</span><span class="prev" id="wtiPrevDate">–</span></div>
              </div>
              <div class="wti-stats">
                <div class="wti-stat"><span>2W HIGH</span><strong id="wtiHigh">–</strong><em id="wtiHighDate">–</em></div>
                <div class="wti-stat"><span>2W LOW</span><strong id="wtiLow">–</strong><em id="wtiLowDate">–</em></div>
                <div class="wti-stat"><span>EVALUATIONS</span><strong id="wtiCount">–</strong><em>실제 평가일</em></div>
              </div>
              <div class="wti-chart-shell"><div class="wti-chart" id="wtiChart"><div class="wti-empty">WTI 데이터 불러오는 중</div></div></div>
              <div class="wti-foot"><span><b>Source</b> · NYMEX WTI Settlement</span><span class="count" id="wtiFootCount">최근 14일</span></div>
            </aside>
          </div></main>
          <footer><div class="wrap">Aromatics Freight Monitor · S&amp;P Global Platts 기반 운임·벙커 리서치 플랫폼</div></footer>
          <script>(function(){function el(id){{return document.getElementById(id);}}function md(d){{return d.slice(5).replace('-','/');}}function money(v){{return '$'+Number(v).toFixed(2);}}function fail(msg){{var h=el('wtiChart');if(h)h.innerHTML='<div class="wti-empty">'+msg+'</div>';}}fetch('latest.html?ts='+Date.now(),{{cache:'no-store'}}).then(function(r){{if(!r.ok)throw new Error('load');return r.text();}}).then(function(html){{var doc=new DOMParser().parseFromString(html,'text/html');var node=doc.getElementById('rawData');if(!node)throw new Error('raw');var raw=JSON.parse(node.textContent||'{{}}');var s=(raw.c||[]).find(function(x){{return x.sym==='NMCL001';}});if(!s||!raw.d||!raw.d.length)throw new Error('series');var lastMs=Date.parse(raw.d[raw.d.length-1]+'T00:00:00Z');var cutoff=lastMs-13*86400000,pts=[];raw.d.forEach(function(d,i){{var v=s.v[i];if(v!=null&&Date.parse(d+'T00:00:00Z')>=cutoff)pts.push({{d:d,v:Number(v)}});}});if(!pts.length)throw new Error('empty');var latest=pts[pts.length-1],prev=pts.length>1?pts[pts.length-2]:null;var hiPt=pts.reduce(function(a,b){{return b.v>a.v?b:a;}}),loPt=pts.reduce(function(a,b){{return b.v<a.v?b:a;}});var chg=prev?latest.v-prev.v:null,pct=prev&&prev.v?chg/prev.v*100:null;el('wtiLatest').innerHTML=money(latest.v)+'<small>/b</small>';el('wtiDate').textContent=latest.d;el('wtiHigh').textContent=money(hiPt.v);el('wtiHighDate').textContent=hiPt.d;el('wtiLow').textContent=money(loPt.v);el('wtiLowDate').textContent=loPt.d;el('wtiCount').textContent=String(pts.length);el('wtiFootCount').textContent='평가 '+pts.length+'회';var ch=el('wtiChange');if(chg==null){{ch.textContent='전회 대비 없음';ch.className='chg flat';el('wtiPrevDate').textContent='–';}}else{{ch.textContent=(chg>0?'▲ ':'▼ ')+Math.abs(chg).toFixed(2)+' · '+(pct>=0?'+':'')+pct.toFixed(2)+'%';ch.className='chg '+(chg>0?'up':chg<0?'down':'flat');el('wtiPrevDate').textContent=prev.d+' 대비';}}var W=560,H=330,L=54,R=72,T=28,B=44;var vals=pts.map(function(p){{return p.v;}}),lo=Math.min.apply(null,vals),hi=Math.max.apply(null,vals);var vr=Math.max(hi-lo,1),ymin=lo-vr*.16,ymax=hi+vr*.16;var t0=Date.parse(pts[0].d+'T00:00:00Z'),t1=Date.parse(latest.d+'T00:00:00Z'),span=Math.max(t1-t0,1);function xp(d){{return L+(Date.parse(d+'T00:00:00Z')-t0)/span*(W-L-R);}}function yp(v){{return T+(ymax-v)/(ymax-ymin)*(H-T-B);}}var bottom=H-B;var ygrid='',yticks=5;for(var g=0;g<yticks;g++){{var ratio=g/(yticks-1),value=ymax-(ymax-ymin)*ratio,y=T+(H-T-B)*ratio;ygrid+='<line class="grid" x1="'+L+'" y1="'+y.toFixed(1)+'" x2="'+(W-R)+'" y2="'+y.toFixed(1)+'"/>';ygrid+='<text class="axis-text" x="'+(L-8)+'" y="'+(y+3).toFixed(1)+'" text-anchor="end">'+value.toFixed(1)+'</text>';}}var idxs=[0,Math.round((pts.length-1)*.25),Math.round((pts.length-1)*.5),Math.round((pts.length-1)*.75),pts.length-1].filter(function(v,i,a){{return a.indexOf(v)===i;}});var xlabels=idxs.map(function(i){{var x=xp(pts[i].d);return '<text class="axis-text" x="'+x.toFixed(1)+'" y="'+(H-12)+'" text-anchor="'+(i===0?'start':i===pts.length-1?'end':'middle')+'">'+md(pts[i].d)+'</text>';}}).join('');var coords=pts.map(function(p){{return xp(p.d).toFixed(1)+','+yp(p.v).toFixed(1);}}).join(' ');var firstX=xp(pts[0].d).toFixed(1),lastX=xp(latest.d).toFixed(1);var area='M '+firstX+' '+bottom+' L '+pts.map(function(p){{return xp(p.d).toFixed(1)+' '+yp(p.v).toFixed(1);}}).join(' L ')+' L '+lastX+' '+bottom+' Z';var circles=pts.map(function(p,i){{var latestC=i===pts.length-1,extreme=p===hiPt||p===loPt;return '<circle class="point '+(latestC?'latest':extreme?'extreme':'')+'" cx="'+xp(p.d).toFixed(1)+'" cy="'+yp(p.v).toFixed(1)+'" r="'+(latestC?5:extreme?4:2.6)+'"><title>'+p.d+' · '+money(p.v)+'/b</title></circle>';}}).join('');var hy=yp(hiPt.v),ly=yp(loPt.v),lx=xp(latest.d),lvy=yp(latest.v);var rangeLines='<line class="range-line" x1="'+L+'" y1="'+hy.toFixed(1)+'" x2="'+(W-R)+'" y2="'+hy.toFixed(1)+'"/><text class="range-text" x="'+(L+3)+'" y="'+(hy-5).toFixed(1)+'">2W HIGH '+money(hiPt.v)+'</text>'+'<line class="range-line" x1="'+L+'" y1="'+ly.toFixed(1)+'" x2="'+(W-R)+'" y2="'+ly.toFixed(1)+'"/><text class="range-text" x="'+(L+3)+'" y="'+(ly+13).toFixed(1)+'">2W LOW '+money(loPt.v)+'</text>';var latestLabel='<line class="latest-guide" x1="'+lx.toFixed(1)+'" y1="'+lvy.toFixed(1)+'" x2="'+lx.toFixed(1)+'" y2="'+bottom+'"/><rect class="latest-box" x="'+(lx+8).toFixed(1)+'" y="'+(lvy-13).toFixed(1)+'" width="62" height="25" rx="6"/><text class="latest-text" x="'+(lx+39).toFixed(1)+'" y="'+(lvy+4).toFixed(1)+'" text-anchor="middle">'+money(latest.v)+'</text>';el('wtiChart').innerHTML='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="WTI 최근 2주 가격 추이"><defs><linearGradient id="wtiArea" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2e6ba8" stop-opacity=".24"/><stop offset="100%" stop-color="#2e6ba8" stop-opacity=".02"/></linearGradient></defs>'+ygrid+rangeLines+'<path class="area" d="'+area+'"/><polyline class="trend" points="'+coords+'"/>'+circles+latestLabel+xlabels+'</svg>';}}).catch(function(){{fail('WTI 데이터 로드 실패');}});}})();</script>
          </body></html>'''

          Path('index.html').write_text(index, encoding='utf-8')

      - name: Commit latest dashboard and premium landing
        run: |
          if git diff --quiet -- latest.html index.html; then
            echo "No publish change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.html index.html
          git commit -m "Publish latest dashboard and refresh premium landing"
          git pull --rebase origin main
          git push origin main
