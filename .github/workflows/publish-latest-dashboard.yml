name: Publish latest freight dashboard

on:
  push:
    branches:
      - main
    paths:
      - 'freight_*.html'
      - 'freight_bunker_dashboard_*.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-latest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh latest report
        shell: python
        run: |
          from pathlib import Path
          import re, shutil

          reports = []

          for p in Path('.').glob('*.html'):
              m = re.fullmatch(r'freight_(\d{8})\.html', p.name, re.I)
              if m:
                  reports.append((m.group(1), p, 0))
                  continue

              m = re.fullmatch(
                  r'freight_bunker_dashboard_(\d{4})-(\d{2})-(\d{2})(?:_[A-Za-z0-9_-]+)?\.html',
                  p.name,
                  re.I
              )
              if m:
                  reports.append((''.join(m.groups()), p, 1))

          if not reports:
              raise SystemExit('No dated freight dashboard HTML found.')

          best = {}
          for ymd, p, score in reports:
              if ymd not in best or score < best[ymd][0]:
                  best[ymd] = (score, p)

          reports = sorted(
              [(ymd, value[1]) for ymd, value in best.items()],
              reverse=True
          )

          latest_ymd, latest_src = reports[0]
          shutil.copyfile(latest_src, 'latest.html')
          print(f'latest={latest_src.name} ({latest_ymd})')

      - name: Commit latest dashboard
        run: |
          if git diff --quiet -- latest.html; then
            echo "No latest.html change."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.html
          git commit -m "Publish latest freight dashboard"
          git pull --rebase origin main
          git push origin main
