<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>F/B LAM · Freight & Bunker Monitor</title>
<style>
:root{--navy:#0B2A6B;--gold:#C9A227;--ink:#0F172A;--muted:#64748B;--line:#E2E8F0;--tint:#F6F8FB}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:#fff;color:var(--ink)}
.hero{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(180deg,#071b46 0,#0B2A6B 48%,#fff 48%,#fff 100%)}
.card{width:min(720px,100%);background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 20px 60px rgba(2,18,51,.18);overflow:hidden}
.top{padding:34px 30px;background:var(--navy);color:#fff;border-bottom:4px solid var(--gold)}
.brand{font-size:34px;font-weight:800;letter-spacing:.02em}.brand span{color:#f3cf60}
.sub{margin-top:7px;color:#c7d4ef;font-size:14px;letter-spacing:.08em}
.body{padding:28px 30px}
.badge{display:inline-block;background:#FFF8DC;color:#7B5D00;border:1px solid #E9D889;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:700}
h1{font-size:22px;margin:16px 0 8px;color:var(--navy)}
p{margin:0;color:var(--muted);line-height:1.75}
.note{margin-top:20px;padding:14px 16px;background:var(--tint);border-left:4px solid var(--gold);font-size:13px;color:#475569}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.btn{display:block;text-align:center;text-decoration:none;border-radius:10px;padding:12px 14px;font-weight:800;font-size:14px}
.btn.admin{background:var(--gold);color:#10234f}
.btn.home{border:1px solid var(--line);color:var(--navy);background:#fff}
@media(max-width:560px){.actions{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="hero"><div class="card">
<div class="top"><div class="brand">F/B <span>LAM</span></div><div class="sub">AROMATICS FREIGHT &amp; BUNKER MONITOR</div></div>
<div class="body"><span class="badge">GitHub Pages 정상 연결</span>
<h1>데일리 리포트 발행 대기 중</h1>
<p>관리자에서 <b>Sheet 저장 + GitHub 발행</b>을 실행하면 이 주소에 최신 운임·벙커 대시보드가 자동으로 표시됨.</p>
<div class="actions">
<a class="btn admin" href="https://script.google.com/macros/s/AKfycbzxIuEZty6WF4wplS9ZJK1rie3Mmjrcb7rwQ-QoCJJepRdQuTlkpsv2IOkvSbdfeXEF/exec?page=admin">관리자 입장 · HTML 업로드</a>
<a class="btn home" href="./">F/B LAM 홈</a>
</div>
<div class="note">첫 데일리 HTML 발행 전에는 이 대기 화면 표시. 관리자 버튼으로 바로 업로드 가능.</div>
</div></div></div>
</body></html>
